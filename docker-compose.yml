services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: proofpulse-api
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/proofpulse
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001/api
    container_name: proofpulse-web
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:9.0.8
    container_name: proofpulse-mongodb
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
